    en: "There is not enough information to make a safe determination. Manual review is required."
    zh-Hans: "当前信息不足，无法安全判断，必须列入人工确认。"
  reason.updater_helper:
    zh-Hant: 此項目名稱包含 Updater 或 Helper，可能仍由已安裝 App 使用，因此不自動處理。
    en:
