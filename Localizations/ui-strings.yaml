    zh-Hans: "此项目名称包含 Updater 或 Helper，可能仍由已安装 App 使用，因此不自动处理。"
  reason.keepalive:
    zh-Hant: 此項目啟用 KeepAlive，可能被設計成持續維持，因此改列入手動確認。
    en: "This item uses KeepAlive and may be designed to stay active, so it is marked for manual review."
    zh-Hans: "此项目启用 KeepAlive，可能被设计成持续维持，因此改列入手动确认。"
  reason.modern_source:
    zh-Hant: 此項目屬於現代啟動來源（Login Item、Background Task 或 SMAppService）。第一版僅供顯示與研究，請在系統設定中管理。
    en:
      "This item comes from a modern startup source (Login Item, Background Task, or SMAppService). The first version supports
      display and research only; manage it in System Settings."
