# =============================================================================
# Mac Autoruns Lite — 介面文字對照
# =============================================================================
#
# 怎麼填
#   1. zh-Hant 是目前 App 裡的繁體中文原文，請不要改。
#   2. 把 en、zh-Hans 填上對應翻譯。留空表示還沒譯。
#   3. 花括號佔位符必須原樣保留，例如 {count}、{label}、{minutes}。
#   4. 標了 keep: true 的項目是技術專有名詞，建議三語都維持原文。
#   5. 相同中文若語意相同，只列一次；之後接到 App 時會共用同一個 key。
#
# 不必翻譯
#   - 服務 Label、檔案路徑、Bundle ID、launchctl 指令輸出
#   - 搜尋模板變數：{label} {type} {keyword}
#   - 服務研究預設關鍵字：macOS、safe to disable、safe to remove、reddit
#   - 工作階段紀錄裡的英文 debug log（scan started 等）
#
# 填完後把這個檔案交給我，我再接到 Xcode String Catalog。
# =============================================================================

meta:
  source_language: zh-Hant
  target_languages: [en, zh-Hans]
  app: Mac Autoruns Lite

