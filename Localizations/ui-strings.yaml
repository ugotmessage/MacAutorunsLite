status_help:
  title:
    zh-Hant: 啟動項目狀態說明
    en: "Startup Item Status Help"
    zh-Hans: "启动项状态说明"
  intro:
    zh-Hant: Mac 的自動啟動由 launchd 管理。
    en: "Mac startup is managed by launchd."
    zh-Hans: "Mac 的自动启动由 launchd 管理。"
  flow.plist:
    keep: true
    zh-Hant: plist
    en: plist
    zh-Hans: plist
  flow.load:
    zh-Hant: launchd 載入設定
    en: "launchd loads configuration"
    zh-Hans: "launchd 加载设置"
  flow.wait:
    zh-Hant: 等待啟動條件
    en: "Wait for launch condition"
    zh-Hans: "等待启动条件"
  flow.run:
    zh-Hant: 執行程式
    en: "Run program"
    zh-Hans: "执行程序"
  note.loaded:
    zh-Hant: 已載入不代表程式一定正在執行。
    en: "Loaded does not mean the program is necessarily running."
    zh-Hans: "已加载不代表程序一定正在执行。"
  note.unloaded:
    zh-Hant: 未載入也不代表此項目無用。
    en: "Unloaded does not mean the item is unused."
    zh-Hans: "未加载也不代表此项目无用。"
  note.recommendation:
    zh-Hant: MacAutorunsLite 會另外提供「處理建議」，協助你判斷是否需要停用或清理。
    en:
      "MacAutorunsLite also provides “Recommendations” to help you decide whether an item should be disabled or cleaned
      up."
    zh-Hans: "MacAutorunsLite 会另外提供「处理建议」，协助你判断是否需要停用或清理。"
  what_is_launch_agent:
    zh-Hant: 什麼是 LaunchAgent？
    en: "What is a LaunchAgent?"
    zh-Hans: "什么是 LaunchAgent？"
  what_is_launch_agent_body:
    zh-Hant: LaunchAgent 通常是在使用者登入後，由 launchd 管理的背景服務。它被載入後，不一定會立刻佔用 CPU 或記憶體。
    en:
      "A LaunchAgent is usually a background service managed by launchd after a user logs in. Being loaded does not necessarily
      mean it immediately uses CPU or memory."
    zh-Hans: "LaunchAgent 通常是在用户登录后，由 launchd 管理的背景服务。它被加载后，不一定会立刻占用 CPU 或内存。"
  what_is_launch_daemon:
    zh-Hant: 什麼是 LaunchDaemon？
    en: "What is a LaunchDaemon?"
    zh-Hans: "什么是 LaunchDaemon？"
  what_is_launch_daemon_body:
    zh-Hant: LaunchDaemon 是系統層級背景服務，通常不依賴某個使用者登入。
    en:
      "A LaunchDaemon is a system-level background service and usually does not depend on a particular user being logged
      in."
    zh-Hans: "LaunchDaemon 是系统级别背景服务，通常不依赖某个用户登录。"
  modern_sources_title:
    keep: true
    zh-Hant: Login Item、Background Task、SMAppService
    en: Login Item, Background Task, SMAppService
    zh-Hans: Login Item、Background Task、SMAppService
  modern_sources_body:
    zh-Hant: 這三種是 macOS 13 之後的現代啟動來源。Login Item 會在登入時開啟 App；Background Task 與 SMAppService 由系統設定的「登入項目與延伸功能」管理。它們的「已載入」不代表 launchd 已載入 plist。v0.2 只提供顯示與研究，請在系統設定中啟用或停用。
    en: "These three are modern startup sources introduced in macOS 13 and later. Login Items open apps at login, while Background Tasks and SMAppService entries are managed in System Settings under Login Items & Extensions. Their “Loaded” state does not mean launchd has loaded a plist. In v0.2, they are shown for display and research only; enable or disable them in System Settings."
    zh-Hans: "这三种是 macOS 13 之后的现代启动来源。Login Item 会在登录时开启 App；Background Task 与 SMAppService 由系统设置的「登录项目与扩展功能」管理。它们的「已加载」不代表 launchd 已加载 plist。v0.2 只提供显示与研究，请在系统设置中启用或停用。"

